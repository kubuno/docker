name: Build & publish image

# L'image « tout-en-un » agrège le core + tous les modules. Ce dépôt ne contient
# que l'outillage Docker ; la CI clone les composants (dépôts publics kubuno/*)
# puis construit et pousse l'image vers GHCR.
#
# Déclenchement :
#   - push d'un tag v*        → build + push (:<version> + :latest)
#   - workflow_dispatch       → build manuel (option : sous-ensemble de modules,
#                               et push on/off)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      modules:
        description: "Modules à inclure (vide = tous)"
        required: false
        default: ""
      push:
        description: "Pousser l'image ?"
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/kubuno/kubuno

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (dépôt docker)
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque sur le runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Déterminer la liste des modules (source unique = VERSIONS)
        run: |
          set -e
          # VERSIONS is the ONLY place that says what the image contains. This
          # list used to be repeated in `env:` as well, and the copies drifted:
          # a module pinned in VERSIONS and advertised by the Dockerfile was
          # silently left out of the published image, because the build-arg
          # below overrides the Dockerfile default. Derive it, never retype it.
          [ -f VERSIONS ] || { echo "::error::VERSIONS manquant (gen_docker_versions.sh)"; exit 1; }
          MODS="${{ github.event.inputs.modules }}"
          if [ -z "$MODS" ]; then
            MODS="$(grep -v '^[[:space:]]*#' VERSIONS | grep '=' | grep -v '^core=' | cut -d= -f1 | tr '\n' ' ')"
          fi
          MODS="$(echo $MODS)"
          [ -n "$MODS" ] || { echo "::error::aucun module déduit de VERSIONS"; exit 1; }
          echo "MODULES=$MODS" >> "$GITHUB_ENV"
          echo "Modules retenus ($(echo $MODS | wc -w)) : $MODS"

      - name: Cloner le core + les modules aux tags épinglés (VERSIONS)
        run: |
          set -e
          # Every component is cloned at the tag pinned in VERSIONS — never at
          # main — so a given image tag is reproducible. Regenerate the manifest
          # with _tools/gen_docker_versions.sh in the workspace.
          for m in core $MODULES; do
            tag="$(grep "^$m=" VERSIONS | cut -d= -f2)"
            [ -n "$tag" ] || { echo "::error::$m absent de VERSIONS"; exit 1; }
            echo "::group::clone $m @ $tag"
            git clone --depth 1 --branch "$tag" "https://github.com/kubuno/$m.git" "$m"
            echo "::endgroup::"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODULES=${{ env.MODULES }}
